databaseChangeLog:
  - changeSet:
      id: 4
      author: Kolivim
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: documents
      changes:
        - createTable:
            tableName: documents
            schemaName: doc_workflow
            columns:
              - column:
                  name: document_id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
                  remarks: "Идентификатор документа"
#              - column:
#                  name: history_id
#                  type: bigint
#                  constraints:
#                    nullable: true
#                    foreignKeyName: fk_history_id
#                    references: history(id)
#                  remarks: "Идентификатор записи в таблице истории"
              - column:
                  name: register_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_register_id
                    references: register(id)
                  remarks: "Идентификатор записи в таблице регистрации"
              - column:
                  name: inner_id
                  type: varchar
                  remarks: "Внутренний идентификатор документа"
              - column:
                  name: author
                  type: varchar
                  remarks: "Автор документа"
              - column:
                  name: title
                  type: varchar
                  remarks: "Название документа"
              - column:
                  name: status
                  type: varchar
                  remarks: "Статус документа"
              - column:
                  name: create_time
                  type: timestamptz
                  remarks: "Дата создания документа"
              - column:
                  name: update_time
                  type: timestamptz
                  remarks: "Дата изменения документа"

      rollback:
        - dropTable:
            tableName: documents
      comment: 'Документы'