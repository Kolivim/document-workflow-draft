databaseChangeLog:
  - changeSet:
      id: 3
      author: Kolivim
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: history
      changes:
        - createTable:
            tableName: history
            schemaName: doc_workflow
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
                  remarks: "Идентификатор записи в таблице истории изменения документов"
#              - column:
#                  name: history_id
#                  type: bigint
#                  constraints:
#                    nullable: false
#                    foreignKeyName: fk_history_id
#                    references: document(id)
#                  remarks: "Идентификатор изменяемого документа"
              - column:
                  name: author
                  type: varchar
                  remarks: "Автор документа"
              - column:
                  name: time
                  type: timestamptz
                  remarks: "Время изменения документа"
              - column:
                  name: action
                  type: varchar
                  remarks: "Действие с документом"
              - column:
                  name: comment
                  type: varchar
                  remarks: "Комментарий к документу"
              - column:
                  name: document_id
                  type: bigint
                  constraints:
                    nullable: true
                  remarks: "Идентификатор документа"

      rollback:
        - dropTable:
            tableName: history
      comment: 'История изменений документов'