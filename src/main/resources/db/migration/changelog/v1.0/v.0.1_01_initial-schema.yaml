databaseChangeLog:
- changeSet:
    id: 1
    author: Kolivim
    changes:
      - sql:
          dbms: postgresql
          splitStatements: true
          endDelimiter: ";"
          sql: "CREATE SCHEMA IF NOT EXISTS doc_workflow;"
    rollback:
      - sql:
          dbms: postgresql
          splitStatements: true
          endDelimiter: ";"
          sql: "DROP SCHEMA IF EXISTS doc_workflow;"
