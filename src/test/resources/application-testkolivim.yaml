spring:
  liquibase:
    enabled: true
    change-log: classpath:db/migration/database-doc.workflow-changelog-master.xml
    parameters:
      liquibase.duplicateFileMode: WARN

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    liquibase: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE