spring:
  liquibase:
    enabled: true
    change-log: classpath:db/migration/database-doc.workflow-changelog-master.xml
    # Добавляем параметр для игнорирования дубликатов
    parameters:
      liquibase.duplicateFileMode: WARN  # или IGNORE

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    liquibase: INFO                        # Видеть предупреждения Liquibase
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE